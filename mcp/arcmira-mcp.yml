tools:
- name: arcmira_describe
  title: The arcmira client reference
  description: 'Returns the reference for the typed arcmira client the execute tools run: method arguments, return fields,
    entity ID rules, examples, errors, the budget and monitor rules, and documentation links. The optional topic narrows it
    to a method or subject. Reads no indexed content and bills nothing. Docs: https://arcmira.com/docs/mcp-server'
  inputs:
  - topic
  - intent
  read_only: true
  destructive: false
  server: research
- name: arcmira_execute_read
  title: Research with a program
  description: 'Runs JavaScript against the Arcmira API through the arcmira client: indexed YouTube and podcast transcripts,
    mentions, sponsors, recommendations, coverage, Premium transcripts (a Premium read of an untranscribed video uses credits
    from the user''s plan, then the on-demand budget; never ask for cents), and the user''s monitors. Input is an async function
    body with arcmira, ArcmiraError, and console in scope. Output is bounded JSON with the outcome first, then call/rate/build
    facts and capped logs. Methods and examples: arcmira_describe. Filters require entity, channel, or video IDs. Limits:
    30 seconds, 40 API calls, and 12,000 characters of output in total, 3,000 per string, and 100 items per array.'
  inputs:
  - code
  - intent
  read_only: false
  destructive: false
  server: research
- name: arcmira_execute_write
  title: Change Arcmira monitors
  description: 'Runs JavaScript like arcmira_execute_read, with the account writes added: arcmira.monitors.create, arcmira.monitors.update
    (including paused), arcmira.monitors.addEntities, arcmira.monitors.addName and arcmira.monitors.attachTrackers. Use it
    only to save what the user asked to follow: list their monitors first, never assume one exists, and ask how they want
    updates (email or Slack; as it happens, hourly or daily) before creating one. Nothing is deleted; pause instead. Limits:
    30 seconds, 40 API calls, and 12,000 characters of output in total, 3,000 per string, and 100 items per array.'
  inputs:
  - code
  - intent
  read_only: false
  destructive: true
  server: research
