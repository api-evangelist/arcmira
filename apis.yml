aid: arcmira

name: Arcmira

image: https://arcmira.com/arcmira-cover.png?v=20261002

description: Arcmira provides AI-powered search of YouTube transcript data, enabling developers to retrieve timestamped passages, speaker mentions,
  sponsors, and ad reads. Their platform offers JavaScript and Python SDKs, a CLI, and an OAuth-enabled remote MCP for integrating spoken web
  insights into applications. The service includes monitoring capabilities and commercial intelligence features, targeting developers building
  conversational AI and analytics tools.

